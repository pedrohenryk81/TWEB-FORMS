<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição nos jogos escolares</title>
</head>
<body>
    <header>
        <h1>Inscrição nos jogos escolares</h1>
        Preencha os campos abaixo com suas informações
    </header>

    <main>
        <form aid="inscricao-jogos" action="/inscricoes-jogos" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>Identificação do atleta</legend>

                <label for="nome-atleta">Nome completo (obrigatório)</label>
                <input text="text" id="nome-atleta" name="nome-atleta" required>

                <br>
                <label for="nome-social">Nome social</label>
                <input text="text" id="nome-social" name="nome-social">

                <br>
                <label for="matricula">Matrícula (obrigatória)</label>
                <input text="text" id="matricula" name="matricula" required>

                <br>
                <label for="data-nascimento">Data de nascimento</label>
                <input type="date" id="data-nascimento" name="data-nascimento">

                <br>
                <label for="email-atleta">E-mail de contato (obrigatório)</label>
                <input type="email" id="email-atleta" name="email-atleta" required>

                <br>
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">

                <br>
                <label for="site-escola">Site da escola</label>
                <input type="url" id="site-escola" name="site-escola" value="https://">
            </fieldset>

            <br>
            <fieldset>
                <legend>Escola e Delegação</legend>
                
                <label for="escola">Escola (com sugestões)</label>
                <input type="search" id="escola" name="escola" list="escolas" placeholder="Digite ou escolha uma escola">

                <datalist id="escolas">
                    <option value="Escola Horizonte"></option>
                    <option value="Escola Aurora"></option>
                    <option value="Escola Caminhos"></option>
                    <option value="Colégio São João Batista"></option>
                    <option value="IFCE"></option>
                    <option value="IFPE"></option>
                    <option value="IFPR"></option>
                    <option value="IFBH"></option>
                    <option value="IFPB"></option>
                </datalist>

                <br>
                <label for="turma">Turma</label>
                <select id="turma" name="turma" required>
                    <option value="">Selecione uma modalidade</option>
                    <optgroup label="Ensino fundamental">
                        <option value="8-ano">8° Ano</option>
                        <option value="9-ano">9° Ano</option>
                    </optgroup>
                    <optgroup label="Ensino médio">
                        <option value="1-ano">1° Ano</option>
                        <option value="2-ano">2° Ano</option>
                        <option value="3-ano">3° Ano</option>
                    </optgroup>
                </select>

                <br>
                <label for="equipe">Nome da equipe</label>
                <input type="text" id="equipe" name="equipe" value="Equipe Horizonte">

                <br>
                <label for="professor">Professor responsábvel</label>
                <input type="text" id="professor" name="professor">
            
                <br>
                <label for="professor-telefone">Telefone do professor</label>
                <input type="tel" id="professor-telefone" name="professor-telefone">
            </fieldset>

            <br>
            <fieldset>
                <legend>Participação nos jogos</legend>

                <br>
                <label for="modalidade-principal">Modalidade principal (obrigatória)</label><br>
                <select id="modalidade-principal" name="modalidade-principal" required>
                    <option value="">Selecione uma modalidade</option>
                    <optgroup label="Coletivas">
                        <option value="futsal">Futsal</option>
                        <option value="voleibol">Voleibol</option>
                        <option value="basquetebol">Basquetebol</option>
                        <option value="handebol">Handebol</option>
                    </optgroup>
                    <optgroup label="Individuais">
                        <option value="atletismo">Atletismo</option>
                        <option value="natacao">Natação</option>
                        <option value="xadrez">Xadrez</option>
                        <option value="tenis-de-mesa">Tênis de mesa</option>
                    </optgroup>
                </select>

                <br>
                Turno de preferência:
                <br>
                <input type="radio" id="turno-manha" name="turno" value="manha">
                <label for="turno-manha">Manhã</label>

                <input type="radio" id="turno-tarde" name="turno" value="tarde">
                <label for="turno-tarde">Tarde</label>

                <input type="radio" id="turno-noite" name="turno" value="noite">
                <label for="turno-noite">Noite</label>

                <br>
                Modalidade de interesse:
                <br>
                <input type="checkbox" id="interesse-futsal" name="modalidades" value="futsal">
                <label for="interesse-futsal">Futsal</label>

                <input type="checkbox" id="interesse-volei" name="modalidades" value="voleibol">
                <label for="interesse-volei">Voleibol</label>

                <input type="checkbox" id="interesse-basquetebol" name="modalidades" value="basquetebol">
                <label for="interesse-basquetebol">Basquetebol</label>

                <br>
                <input type="checkbox" id="interesse-handebol" name="modalidades" value="handebol">
                <label for="interesse-handebol">Handebol</label>

                <input type="checkbox" id="interesse-atletismo" name="modalidades" value="atletismo">
                <label for="interesse-atletismo">Atletismo</label>

                <input type="checkbox" id="interesse-natacao" name="modalidades" value="natacao">
                <label for="interesse-natacao">Natação</label>

                <br>
                <input type="checkbox" id="interesse-xadrez" name="modalidades" value="xadrez">
                <label for="interesse-atletismo">Xadrez</label>

                <input type="checkbox" id="interesse-tenis-de-mesa" name="modalidades" value="tenis-de-mesa">
                <label for="interesse-tenis-de-mesa">Tênis de mesa</label>
            </fieldset>

            <br>
            <fieldset>
                <legend>Preferências, Anexos e Observações</legend>                

                <br>
                <label for="observacoes">Observações para a organização</label><br>
                <textarea id="observacoes" name="observacoes" rows="5" cols="50"></textarea>
            </fieldset>

            <br>
            <label for="acompanhantes">Quantidade de acompanhantes</label>
            <input type="number" id="acompanhantes" name="acompanhantes" value="2">
        
            <br>
            <button type="submit" name="acao" value="inscrever">Confirmar inscrição</button>
        </form>
    </main>
</body>
</html>
